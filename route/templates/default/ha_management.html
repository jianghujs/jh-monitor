{% extends "layout.html" %}

{% block content %}
<div class="main-content pb55 ha-page">
  <div class="container-fluid">
    <div class="pos-box bgw mtb15">
      <div class="position f14 c9 pull-left">
        <a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">主备管理</span>
      </div>
      <div class="search pull-right">
        <form target="hid" onsubmit="haRenderList($('#SearchValue').prop('value')); return false;">
          <input type="text" id="SearchValue" class="ser-text pull-left" placeholder="主备关系/主机搜索"/>
          <button type="button" class="ser-sub pull-left" onclick="haRenderList($('#SearchValue').prop('value'))"></button>
        </form>
        <iframe name="hid" id="hid" style="display:none"></iframe>
      </div>
    </div>

    <div class="ha-shell">
      <div class="ha-summary-row">
        <div class="ha-summary ha-summary-danger">
          <div class="ha-summary-label">红色异常</div>
          <div class="ha-summary-value" id="haDangerCount">0</div>
          <div class="ha-summary-note">离线、双主、切换失败</div>
        </div>
        <div class="ha-summary ha-summary-warning">
          <div class="ha-summary-label">橙色提醒</div>
          <div class="ha-summary-value" id="haWarningCount">0</div>
          <div class="ha-summary-note">mysql、rsync、回调待处理</div>
        </div>
        <div class="ha-summary ha-summary-normal">
          <div class="ha-summary-label">状态正常</div>
          <div class="ha-summary-value" id="haNormalCount">0</div>
          <div class="ha-summary-note">期望状态与实际状态一致</div>
        </div>
        <div class="ha-summary ha-summary-switching">
          <div class="ha-summary-label">切换中</div>
          <div class="ha-summary-value" id="haSwitchingCount">0</div>
          <div class="ha-summary-note">下线、上线、验证阶段</div>
        </div>
      </div>

      <div class="safe bgw pd15 ha-main-panel">
        <div class="ha-toolbar">
          <div>
            <button onclick="haOpenPairDialog()" class="btn btn-success btn-sm btn-title" type="button">绑定主备关系</button>
            <button onclick="haRefreshMock()" class="btn btn-default btn-sm btn-title ml-2" type="button">刷新</button>
          </div>
          <span class="set-info c7">UI 预览使用模拟数据，状态和日志 API 将在后续实现</span>
        </div>

        <div id="haEmptyState" class="ha-empty" style="display:none;">
          <div class="ha-empty-title">暂无主备关系</div>
          <div class="ha-empty-sub">绑定两台江湖面板后，可在这里查看主备状态并发起手动切换。</div>
          <button onclick="haOpenPairDialog()" class="btn btn-success btn-sm">绑定主备关系</button>
        </div>

        <div class="divtable ha-table-wrap">
          <div class="tablescroll ha-table-scroll">
            <table class="table table-hover ha-table">
              <colgroup>
                <col style="width: 190px;">
                <col style="width: 220px;">
                <col style="width: 220px;">
                <col style="width: 95px;">
                <col style="width: 150px;">
                <col style="width: 145px;">
                <col style="width: 170px;">
              </colgroup>
              <thead>
                <tr>
                  <th>主备关系</th>
                  <th>主机</th>
                  <th>备用机</th>
                  <th class="text-center">状态</th>
                  <th class="text-center">期望/实际</th>
                  <th class="text-center">最近上报</th>
                  <th class="text-right">操作</th>
                </tr>
              </thead>
              <tbody id="haPairBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="/static/app/ha_management.js?v={{config.version}}"></script>

<style>
.ha-page {
  height: 100vh;
  padding-bottom: 55px;
  box-sizing: border-box;
  overflow: hidden;
}
.ha-page > .container-fluid {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 15px;
  overflow: hidden;
}
.ha-shell {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ha-summary-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.ha-summary {
  background: #fff;
  border: 1px solid #e6e9ef;
  border-left-width: 4px;
  border-radius: 4px;
  padding: 12px 14px;
  min-height: 86px;
}
.ha-summary-danger { border-left-color: #d9534f; }
.ha-summary-warning { border-left-color: #f0ad4e; }
.ha-summary-normal { border-left-color: #5cb85c; }
.ha-summary-switching { border-left-color: #337ab7; }
.ha-summary-label { color: #666; font-size: 12px; }
.ha-summary-value { color: #222; font-size: 28px; line-height: 34px; font-weight: 600; }
.ha-summary-note { color: #999; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-main-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.ha-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.ha-table-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.ha-table-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.ha-table { min-width: 1190px; table-layout: fixed; }
.ha-table th,
.ha-table td { vertical-align: middle !important; }
.ha-main { font-size: 13px; font-weight: 600; color: #222; line-height: 20px; }
.ha-sub { color: #999; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-status-pill {
  display: inline-block;
  min-width: 70px;
  text-align: center;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid transparent;
}
.ha-pill-danger { color: #b02a25; background: #fff1f0; border-color: #f0c6c4; }
.ha-pill-warning { color: #9a6200; background: #fff7e6; border-color: #f1d399; }
.ha-pill-normal { color: #2e7d32; background: #f0fff0; border-color: #bfe4bf; }
.ha-pill-switching { color: #245580; background: #eef7ff; border-color: #b8d7ef; }
.ha-role-mark { display: inline-block; width: 34px; text-align: center; border-radius: 3px; padding: 2px 0; margin-right: 6px; font-size: 12px; }
.ha-role-master { color: #2e7d32; background: #f0fff0; border: 1px solid #bfe4bf; }
.ha-role-standby { color: #666; background: #f7f8fa; border: 1px solid #dfe4ea; }
.ha-online { color: #5cb85c; }
.ha-offline { color: #d9534f; }
.ha-sync-ok { color: #5cb85c; }
.ha-sync-bad { color: #d9534f; }
.ha-sync-wait { color: #337ab7; }
.ha-health-row {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.ha-health-item {
  border: 1px solid #edf0f4;
  border-radius: 4px;
  padding: 8px 10px;
  min-height: 56px;
}
.ha-health-label { color: #999; font-size: 12px; }
.ha-health-value { color: #333; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-op-links .btlink { margin-left: 8px; }
.ha-muted { color: #999; font-size: 12px; }
.ha-empty {
  flex: 1;
  min-height: 260px;
  border: 1px dashed #cfd6df;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #999;
}
.ha-empty-title { color: #333; font-size: 16px; font-weight: 600; }
.ha-empty-sub { font-size: 13px; }
.ha-dialog-form .line .tname { width: 120px; }
.ha-detail-shell { height: 565px; }
.ha-detail-menu { height: 565px; }
.ha-detail-con {
  height: 565px;
  overflow: auto;
  background: #fcf8f8;
}
.ha-detail-section { min-height: 100%; }
.ha-detail-log-box { height: 430px; }
.ha-health-detail-table { min-width: 760px; }
.ha-health-detail-table th,
.ha-health-detail-table td { vertical-align: middle !important; }
.ha-switch-detail-table { min-width: 840px; }
.ha-switch-detail-table th,
.ha-switch-detail-table td { vertical-align: middle !important; }
.ha-host-log-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ha-host-log-panel {
  border: 1px solid #e6e9ef;
  border-radius: 4px;
  background: #fff;
  overflow: hidden;
}
.ha-host-log-head {
  height: 58px;
  padding: 8px 10px;
  border-bottom: 1px solid #edf0f4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ha-host-log-box {
  height: 190px;
  border-radius: 0;
}
.ha-option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
  padding: 0 15px 10px;
}
.ha-option-grid label { font-weight: normal; color: #555; }
.ha-log-box {
  height: 360px;
  background: #1f2329;
  color: #d7dde8;
  border-radius: 4px;
  padding: 12px;
  overflow: auto;
  font-family: Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 20px;
  white-space: pre-wrap;
}
@media (max-width: 1100px) {
  .ha-summary-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
{% endblock %}
