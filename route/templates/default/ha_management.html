{% extends "layout.html" %}

{% block content %}
<div class="main-content pb55 ha-page">
  <div class="container-fluid">
    <div class="pos-box bgw mtb15">
      <div class="position f14 c9 pull-left">
        <a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">主备管理</span>
      </div>
      <div class="search pull-right">
        <form target="hid" onsubmit="haRenderList($('#SearchValue').prop('value')); return false;">
          <input type="text" id="SearchValue" class="ser-text pull-left" placeholder="主备关系/主机搜索"/>
          <button type="button" class="ser-sub pull-left" onclick="haRenderList($('#SearchValue').prop('value'))"></button>
        </form>
        <iframe name="hid" id="hid" style="display:none"></iframe>
      </div>
    </div>

    <div class="ha-shell">
      <div class="safe bgw pd15 ha-main-panel">
        <div class="ha-toolbar">
          <div>
            <button onclick="haRefreshMock()" class="btn btn-default btn-sm btn-title ml-2" type="button">刷新</button>
          </div>
          <span class="set-info c7">主备关系由 ha_manager 插件绑定并上报到云监控</span>
        </div>

        <div id="haEmptyState" class="ha-empty" style="display:none;">
          <div class="ha-empty-title">暂无主备关系</div>
          <div class="ha-empty-sub">请先在江湖面板 ha_manager 插件里完成主备绑定、填写主备关系名称并配置云监控地址。</div>
        </div>

        <div class="divtable ha-table-wrap">
          <div class="tablescroll ha-table-scroll">
            <table class="table table-hover ha-table">
              <colgroup>
                <col style="width: 230px;">
                <col style="width: 430px;">
                <col style="width: 140px;">
                <col style="width: 155px;">
                <col style="width: 175px;">
              </colgroup>
              <thead>
                <tr>
                  <th>主备关系</th>
                  <th>主机</th>
                  <th class="text-center">状态</th>
                  <th class="text-center">最近上报</th>
                  <th class="text-right">操作</th>
                </tr>
              </thead>
              <tbody id="haPairBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="/static/app/ha_management.js?v={{config.version}}"></script>

<style>
.ha-page {
  height: 100vh;
  padding-bottom: 55px;
  box-sizing: border-box;
  overflow: hidden;
}
.ha-page > .container-fluid {
  height: 100%;
  display: flex;
  flex-direction: column;
  /* gap: 15px; */
  overflow: hidden;
}
.ha-shell {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ha-main-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.ha-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.ha-table-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.ha-table-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.ha-table { min-width: 1100px; table-layout: fixed; }
.ha-table th,
.ha-table td { vertical-align: middle !important; }
.ha-main { font-size: 13px; font-weight: 600; color: #222; line-height: 20px; }
.ha-sub { color: #999; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-status-pill {
  display: inline-block;
  min-width: 70px;
  text-align: center;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid transparent;
}
.ha-pill-danger { color: #b02a25; background: #fff1f0; border-color: #f0c6c4; }
.ha-pill-warning { color: #9a6200; background: #fff7e6; border-color: #f1d399; }
.ha-pill-normal { color: #2e7d32; background: #f0fff0; border-color: #bfe4bf; }
.ha-pill-switching { color: #245580; background: #eef7ff; border-color: #b8d7ef; }
.ha-status-desc { margin-top: 4px; color: #999; font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-role-mark { display: inline-block; width: 34px; text-align: center; border-radius: 3px; padding: 2px 0; margin-right: 6px; font-size: 12px; }
.ha-role-master { color: #2e7d32; background: #f0fff0; border: 1px solid #bfe4bf; }
.ha-role-standby { color: #245580; background: #eef7ff; border: 1px solid #b8d7ef; }
.ha-host-list-cell { display: flex; flex-direction: column; gap: 6px; }
.ha-host-line { display: flex; align-items: center; gap: 6px; min-width: 0; line-height: 22px; }
.ha-host-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ha-host-dot-online { background: #5cb85c; box-shadow: 0 0 0 2px rgba(92,184,92,.12); }
.ha-host-dot-offline { background: #b8c0cc; box-shadow: 0 0 0 2px rgba(153,153,153,.14); }
.ha-host-dot-switching { background: #f0ad4e; animation: haBlink 1.1s ease-in-out infinite; box-shadow: 0 0 0 2px rgba(240,173,78,.18); }
@keyframes haBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.ha-host-name { flex: 0 1 auto; min-width: 0; font-weight: 600; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-host-name-offline { color: #999; }
.ha-current-site-tag { flex: 0 0 auto; color: #245580; background: #eef7ff; border: 1px solid #b8d7ef; border-radius: 3px; padding: 1px 5px; font-size: 12px; line-height: 18px; }
.ha-host-ip { flex: 0 0 auto; color: #999; font-size: 12px; }
.ha-online { color: #5cb85c; }
.ha-offline { color: #d9534f; }
.ha-sync-ok { color: #5cb85c; }
.ha-sync-bad { color: #d9534f; }
.ha-sync-wait { color: #337ab7; }
.ha-health-row {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.ha-health-item {
  border: 1px solid #edf0f4;
  border-radius: 4px;
  padding: 8px 10px;
  min-height: 56px;
}
.ha-health-label { color: #999; font-size: 12px; }
.ha-health-value { color: #333; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-op-links .btlink { margin-left: 8px; }
.ha-muted { color: #999; font-size: 12px; }
.ha-empty {
  flex: 1;
  min-height: 260px;
  border: 1px dashed #cfd6df;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #999;
}
.ha-empty-title { color: #333; font-size: 16px; font-weight: 600; }
.ha-empty-sub { font-size: 13px; }
.ha-dialog-form .line .tname { width: 120px; }
.ha-detail-shell { height: 565px; }
.ha-detail-menu { height: 565px; }
.ha-detail-con {
  height: 565px;
  overflow: auto;
  background: #fcf8f8;
}
.ha-detail-section { min-height: 100%; }
.ha-detail-log-box { height: 430px; }
.ha-health-detail-table { min-width: 760px; }
.ha-health-detail-table th,
.ha-health-detail-table td { vertical-align: middle !important; }
.ha-switch-detail-table { min-width: 840px; }
.ha-switch-detail-table th,
.ha-switch-detail-table td { vertical-align: middle !important; }
.ha-check-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ha-check-host-card {
  border: 1px solid #e6e9ef;
  border-radius: 4px;
  background: #fff;
  overflow: hidden;
}
.ha-check-host-head {
  height: 48px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid #edf0f4;
}
.ha-check-table { width: 100%; margin-bottom: 0; table-layout: fixed; }
.ha-check-status-col { width: 160px; }
.ha-check-table th,
.ha-check-table td { vertical-align: middle !important; }
.ha-check-group-row td { background: #f7f8fa; color: #666; font-weight: 600; }
.ha-check-name { color: #333; }
.ha-check-status-head { text-align: left; }
.ha-check-actual { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; }
.ha-check-actual-pass { color: #2e7d32; }
.ha-check-actual-fail { color: #b02a25; }
.ha-check-icon { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; margin-right: 6px; font-size: 12px; }
.ha-check-pass { color: #2e7d32; background: #f0fff0; }
.ha-check-warn { color: #9a6200; background: #fff7e6; }
.ha-check-unknown { color: #777; background: #f1f3f5; }
.ha-check-fail { color: #b02a25; background: #fff1f0; }
.ha-host-log-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ha-host-log-panel {
  border: 1px solid #e6e9ef;
  border-radius: 4px;
  background: #fff;
  overflow: hidden;
}
.ha-host-log-head {
  height: 58px;
  padding: 8px 10px;
  border-bottom: 1px solid #edf0f4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ha-host-log-box {
  height: 190px;
  border-radius: 0;
}
.ha-switch-hosts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.ha-switch-host { display: block; border: 1px solid #e6e9ef; border-radius: 4px; background: #fff; padding: 10px 12px; font-weight: normal; cursor: pointer; }
.ha-switch-host input { margin-right: 6px; }
.ha-switch-host-name { font-weight: 600; color: #333; }
.ha-switch-host-meta { font-size: 12px; color: #888; line-height: 20px; margin-left: 21px; }
.ha-switch-options { border: 1px solid #e6e9ef; border-radius: 4px; background: #fff; padding: 12px; margin-top: 10px; }
.ha-switch-options-title { font-weight: 600; color: #333; margin-bottom: 10px; }
.ha-option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.ha-option-check { display: flex; align-items: center; height: 26px; margin: 0; font-weight: normal; color: #555; line-height: 26px; }
.ha-option-check input { margin: 0 8px 0 0; flex: 0 0 auto; }
.ha-sync-options { display: none; }
.ha-sync-group { border: 1px solid #edf0f4; background: #fafbfc; border-radius: 4px; padding: 10px; margin-top: 10px; }
.ha-sync-field { display: flex; align-items: center; margin-top: 8px; }
.ha-sync-field:first-child { margin-top: 0; }
.ha-sync-field span { width: 78px; color: #777; }
.ha-sync-field .bt-input-text { width: 460px; }
.ha-log-box {
  height: 360px;
  background: #1f2329;
  color: #d7dde8;
  border-radius: 4px;
  padding: 12px;
  overflow: auto;
  font-family: Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 20px;
  white-space: pre-wrap;
}
</style>
{% endblock %}
