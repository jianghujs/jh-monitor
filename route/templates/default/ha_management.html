{% extends "layout.html" %}

{% block content %}
<div class="main-content pb55 ha-page">
  <div class="container-fluid">
    <div class="pos-box bgw mtb15">
      <div class="position f14 c9 pull-left">
        <a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">主备管理</span>
      </div>
      <div class="search pull-right">
        <form target="hid" onsubmit="haRenderList($('#SearchValue').prop('value')); return false;">
          <input type="text" id="SearchValue" class="ser-text pull-left" placeholder="主备关系/主机搜索"/>
          <button type="button" class="ser-sub pull-left" onclick="haRenderList($('#SearchValue').prop('value'))"></button>
        </form>
        <iframe name="hid" id="hid" style="display:none"></iframe>
      </div>
    </div>

    <div class="ha-shell">
      <div class="safe bgw pd15 ha-main-panel">
        <div class="ha-toolbar">
          <div>
            <button onclick="haRefreshList()" class="btn btn-default btn-sm btn-title ml-2" type="button">刷新</button>
            <div id="haRefreshControl" class="ha-refresh-control">
              <div class="btn-group">
                <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown">
                  刷新间隔: <span id="haCurrentInterval">60</span>秒
                  <span class="caret"></span>
                </button>
                <ul class="dropdown-menu">
                  <li><a href="javascript:;" onclick="haSetRefreshInterval(5)">5秒</a></li>
                  <li><a href="javascript:;" onclick="haSetRefreshInterval(10)">10秒</a></li>
                  <li><a href="javascript:;" onclick="haSetRefreshInterval(30)">30秒</a></li>
                  <li><a href="javascript:;" onclick="haSetRefreshInterval(60)">1分钟</a></li>
                </ul>
              </div>
              <button id="haToggleRefresh" class="btn btn-default btn-sm" onclick="haToggleRefresh()">
                <span class="glyphicon glyphicon-pause"></span>
                <span>停止刷新</span>
              </button>
            </div>
          </div>
          <span class="set-info c7">主备关系由 ha_manager 插件绑定并上报到云监控</span>
        </div>

        <div id="haEmptyState" class="ha-empty" style="display:none;">
          <div class="ha-empty-title">暂无主备关系</div>
          <div class="ha-empty-sub">请先在江湖面板 ha_manager 插件里完成主备绑定、填写主备关系名称并配置云监控地址。</div>
        </div>

        <div class="divtable ha-table-wrap">
          <div class="tablescroll ha-table-scroll">
            <table class="table table-hover ha-table">
              <colgroup>
                <col style="width: 36px;">
                <col style="width: 230px;">
                <col style="width: 430px;">
                <col style="width: 140px;">
                <col style="width: 155px;">
                <col style="width: 175px;">
              </colgroup>
              <thead>
                <tr>
                  <th title="拖动排序"></th>
                  <th>主备关系</th>
                  <th>主机</th>
                  <th class="text-center">状态</th>
                  <th class="text-center">最近上报</th>
                  <th class="text-right">操作</th>
                </tr>
              </thead>
              <tbody id="haPairBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="/static/app/ha_management.js?v={{config.version}}.202608181955"></script>

.ha-wizard-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.ha-wizard-step { border: 1px solid #e6e9ef; border-radius: 4px; background: #fafbfc; padding: 9px 10px; color: #777; }
.ha-wizard-step.active { border-color: #8dbde8; background: #eef7ff; color: #245580; }
.ha-wizard-step.done { border-color: #bfe4bf; background: #f6fff6; color: #2e7d32; }
.ha-wizard-step-num { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; background: #dfe4ea; color: #666; font-size: 12px; margin-right: 6px; }
.ha-wizard-step.active .ha-wizard-step-num { background: #337ab7; color: #fff; }
.ha-wizard-step.done .ha-wizard-step-num { background: #5cb85c; color: #fff; }
.ha-wizard-body { min-height: 300px; }
.ha-wizard-actions { border-top: 1px solid #edf0f4; margin-top: 12px; padding-top: 12px; text-align: right; }
.ha-wizard-actions .btn { margin-left: 6px; }
.ha-option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.ha-option-check { display: flex; align-items: center; height: 26px; margin: 0; font-weight: normal; color: #555; line-height: 26px; }
.ha-option-check input { margin: 0 8px 0 0; flex: 0 0 auto; }
.ha-sync-options { display: none; }
.ha-sync-group { border: 1px solid #edf0f4; background: #fafbfc; border-radius: 4px; padding: 10px; margin-top: 10px; }
.ha-sync-field { display: flex; align-items: center; margin-top: 8px; }
.ha-sync-field:first-child { margin-top: 0; }
.ha-sync-field span { width: 78px; color: #777; }
.ha-sync-field .bt-input-text { width: 460px; }
.ha-log-box {
  height: 360px;
  background: #1f2329;
  color: #d7dde8;
  border-radius: 4px;
  padding: 12px;
  overflow: auto;
  font-family: Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 20px;
  white-space: pre-wrap;
}
.ha-live-log-wrap { padding: 14px; background: #fff; }
.ha-live-log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: #777; font-size: 12px; }
.ha-live-state { display: inline-flex; align-items: center; gap: 6px; border-radius: 3px; padding: 3px 8px; border: 1px solid transparent; font-size: 12px; line-height: 16px; }
.ha-live-state-running { color: #9a6200; background: #fff7e6; border-color: #f1d399; }
.ha-live-state-success { color: #2e7d32; background: #f0fff0; border-color: #bfe4bf; }
.ha-live-state-failed { color: #b02a25; background: #fff1f0; border-color: #f0c6c4; }
.ha-live-state-running:before { content: ""; display: inline-block; width: 11px; height: 11px; border: 2px solid #f1d399; border-top-color: #f0ad4e; border-radius: 50%; animation: haSpin .8s linear infinite; box-sizing: border-box; }
.ha-live-run-id { font-family: Menlo, Consolas, monospace; color: #999; }
.ha-live-log-box { margin: 0; height: 420px; text-align: left; background: #000; color: #fff; white-space: pre-wrap; border: 0; border-radius: 3px; padding: 10px; overflow: auto; font-family: Menlo, Consolas, monospace; font-size: 12px; line-height: 20px; }
.ha-live-log-tip { margin-top: 8px; color: #888; font-size: 12px; line-height: 20px; }
