{% extends "layout.html" %}

{% block content %}
<div class="main-content pb55 ha-local-page">
  <div class="container-fluid">
    <div class="pos-box bgw mtb15">
      <div class="position f14 c9 pull-left"><a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">本地主备上报</span></div>
    </div>
    <div class="safe bgw pd15">
      <div class="ha-local-toolbar">
        <div>
          <div class="ha-local-title">主备关系</div>
          <div class="ha-local-sub">查看当前机器的角色、状态说明和步骤日志。</div>
          <div class="ha-local-toolbar-actions">
            <button class="btn btn-default btn-sm" type="button" onclick="haLocalLoadPairs()"><span class="glyphicon glyphicon-refresh"></span> 刷新</button>
            <div class="btn-group">
              <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown">刷新间隔: <span id="haLocalCurrentInterval">60</span>秒 <span class="caret"></span></button>
              <ul class="dropdown-menu">
                <li><a href="javascript:;" onclick="haLocalSetRefreshInterval(5)">5秒</a></li>
                <li><a href="javascript:;" onclick="haLocalSetRefreshInterval(10)">10秒</a></li>
                <li><a href="javascript:;" onclick="haLocalSetRefreshInterval(30)">30秒</a></li>
                <li><a href="javascript:;" onclick="haLocalSetRefreshInterval(60)">1分钟</a></li>
              </ul>
            </div>
            <button id="haLocalToggleRefresh" class="btn btn-default btn-sm" type="button" onclick="haLocalToggleRefresh()"><span class="glyphicon glyphicon-pause"></span> <span>停止刷新</span></button>
          </div>
        </div>
        <button class="btn btn-success btn-sm" type="button" onclick="haLocalOpenCreate()">添加主备关系</button>
      </div>
      <div id="haLocalEmpty" class="ha-local-empty" style="display:none;">暂无主备关系，请先添加主备关系，再在本地版插件填写关系 ID。</div>
      <div class="divtable" id="haLocalTableWrap">
        <div class="tablescroll">
          <table class="table table-hover ha-local-table">
            <thead><tr><th>主备关系 ID</th><th>当前机器</th><th>角色</th><th>状态说明</th><th>最近上报</th><th class="text-right">操作</th></tr></thead>
            <tbody id="haLocalPairBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="/static/app/ha_management.js?v={{config.version}}.202609072120"></script>
<style>
.ha-local-page .safe{min-height:420px}.ha-local-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.ha-local-toolbar-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}.ha-local-title{font-size:16px;font-weight:600;color:#222;line-height:24px}.ha-local-sub{font-size:12px;color:#888;line-height:20px}.ha-local-table{min-width:1000px;table-layout:fixed}.ha-local-table th,.ha-local-table td{vertical-align:middle!important}.ha-local-main{font-weight:600;color:#222;line-height:20px}.ha-local-subtext{font-size:12px;color:#888;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ha-local-host-sub{display:flex;align-items:center;gap:6px;min-width:0}.ha-local-host-sub .ha-local-subtext{min-width:0}.ha-local-pair-id-line{display:flex;align-items:center;gap:4px;overflow:visible}.ha-local-pair-id-text{min-width:0;overflow:hidden;text-overflow:ellipsis}.ha-local-copy-btn{flex:0 0 auto;width:18px;height:18px;padding:0;border:0;background:transparent;color:#888;line-height:18px;cursor:pointer}.ha-local-copy-btn:hover{color:#20a53a}.ha-local-copy-btn i{font-size:12px}.ha-local-actions{white-space:nowrap}.ha-local-actions .btlink + .btlink{margin-left:14px}.ha-local-role-tag,.ha-local-online-tag{display:inline-block;border:1px solid transparent;border-radius:3px;text-align:center;font-size:12px;line-height:16px}.ha-local-role-tag{min-width:22px;padding:2px 5px}.ha-local-role-master,.ha-local-online{color:#2e7d32;background:#f0fff0;border-color:#bfe4bf}.ha-local-role-standby{color:#245580;background:#eef7ff;border-color:#b8d7ef}.ha-local-online-tag{flex:0 0 auto;padding:1px 5px}.ha-local-offline{color:#b02a25;background:#fff1f0;border-color:#f0c6c4}.ha-local-online-unknown{color:#777;background:#f5f5f5;border-color:#ddd}.ha-local-status{display:inline-block;min-width:64px;padding:3px 7px;text-align:center;border:1px solid transparent;border-radius:3px;font-size:12px}.ha-local-normal{color:#2e7d32;background:#f0fff0;border-color:#bfe4bf}.ha-local-warning{color:#9a6200;background:#fff7e6;border-color:#f1d399}.ha-local-danger{color:#b02a25;background:#fff1f0;border-color:#f0c6c4}.ha-local-switching{color:#245580;background:#eef7ff;border-color:#b8d7ef}.ha-local-unknown{color:#777;background:#f5f5f5;border-color:#ddd}.ha-local-detail-text{display:inline-block;margin-left:8px;color:#888;font-size:12px;line-height:20px;vertical-align:middle}.ha-local-detail-table .ha-local-role-tag + .ha-local-status{margin-left:8px}.ha-local-detail-table .ha-local-online-tag{margin-left:8px}.ha-local-empty{min-height:250px;display:flex;align-items:center;justify-content:center;border:1px dashed #ccd4de;color:#888;font-size:13px}.ha-local-pair-id{padding:10px;background:#f5f7fa;border:1px solid #ccd4de;border-radius:3px;font:13px/20px Menlo,Consolas,monospace;color:#222;word-break:break-all}.ha-local-task-log{height:430px;margin:0;padding:12px;background:#1f2329;color:#d7dde8;overflow:auto;white-space:pre-wrap;font:12px/20px Menlo,Consolas,monospace}.ha-local-detail-table th{width:120px;background:#fafafa;color:#777;font-weight:normal}.ha-local-detail-table th,.ha-local-detail-table td{vertical-align:middle!important}.ha-local-dialog .line .tname{width:110px}
</style>
{% endblock %}
